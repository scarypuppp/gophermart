definitions:
  handlers.CreateWithdrawRequest:
    properties:
      order:
        type: string
      sum:
        type: number
    type: object
  handlers.GetBalanceResponse:
    properties:
      current:
        type: number
      withdrawn:
        type: number
    type: object
  handlers.GetOrdersResponseItem:
    properties:
      accrual:
        type: number
      number:
        type: string
      status:
        type: string
      uploaded_at:
        type: string
    type: object
  handlers.WithdrawalResponseItem:
    properties:
      order:
        type: string
      processed_at:
        type: string
      sum:
        type: number
    type: object
  handlers.loginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  handlers.loginResponse:
    properties:
      access_token:
        type: string
      user_id:
        type: integer
    type: object
  handlers.registerRequest:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
info:
  contact: {}
  description: Loyalty system API
  title: Gophermart API
  version: "1.0"
paths:
  /api/user/balance:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.GetBalanceResponse'
        "401":
          description: Пользователь не авторизован
          schema:
            type: string
        "500":
          description: Внутренняя ошибка
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Получение баланса пользователя
      tags:
      - balance
  /api/user/balance/withdraw:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные списания
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateWithdrawRequest'
      responses:
        "200":
          description: Успешная обработка запроса
        "401":
          description: Пользователь не авторизован
          schema:
            type: string
        "402":
          description: Недостаточно средств
          schema:
            type: string
        "422":
          description: Неверный номер заказа
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Запрос на списание средств
      tags:
      - balance
  /api/user/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные пользователя
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.loginResponse'
        "400":
          description: Неверный формат запроса
          schema:
            type: string
        "401":
          description: Неверный логин или пароль
          schema:
            type: string
        "500":
          description: Внутренняя ошибка
          schema:
            type: string
      summary: Аутентификация пользователя
      tags:
      - auth
  /api/user/orders:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.GetOrdersResponseItem'
            type: array
        "204":
          description: Нет данных
        "401":
          description: Пользователь не авторизован
          schema:
            type: string
        "500":
          description: Внутренняя ошибка
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Получение списка заказов
      tags:
      - orders
    post:
      consumes:
      - text/plain
      parameters:
      - description: Номер заказа
        in: body
        name: body
        required: true
        schema:
          type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Заказ уже был загружен этим пользователем
        "202":
          description: Новый заказ принят в обработку
        "400":
          description: Неверный формат запроса
          schema:
            type: string
        "401":
          description: Пользователь не аутентифицирован
          schema:
            type: string
        "409":
          description: Заказ уже загружен другим пользователем
          schema:
            type: string
        "422":
          description: Неверный формат номера заказа
          schema:
            type: string
        "500":
          description: Внутренняя ошибка
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Загрузка номера заказа
      tags:
      - orders
  /api/user/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные пользователя
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.registerRequest'
      produces:
      - text/plain
      responses:
        "200":
          description: OK
        "400":
          description: Неверный формат запроса
          schema:
            type: string
        "409":
          description: Логин уже занят
          schema:
            type: string
        "500":
          description: Внутренняя ошибка
          schema:
            type: string
      summary: Регистрация пользователя
      tags:
      - auth
  /api/user/withdrawals:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.WithdrawalResponseItem'
            type: array
        "204":
          description: Нет списаний
        "401":
          description: Пользователь не авторизован
          schema:
            type: string
        "500":
          description: Внутренняя ошибка
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Получение списка списаний
      tags:
      - balance
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
